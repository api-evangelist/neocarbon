name: Neocarbon
description: >-
  NeoCarbon GmbH is a Berlin-based climate-technology company building integrated
  cooling and carbon-capture systems for data centers. Its patented Hollow Fiber
  platform converts low-grade waste heat (30-55C) simultaneously into efficient
  cooling, captured CO2 for industrial reuse, and recovered water, deployed as a
  retrofit without redesigning existing infrastructure. Backed by Speedinvest, the
  company operates as an industrial hardware and climate-infrastructure business
  and does not publish a public developer API, SDKs, or an API developer portal.
